function tex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep)}return t}
function box(w,h,d,mat,x,y,z,ink=0.06,parent=CUR){const g=new THREE.Group();

    m.rotation.y=-Math.PI/2; m.position.set(xc+th/2,0,0); S.add(m); return m};
  mk(0.45,toon({map:conc})); const o=mk(0.57,INK); o.scale.set(1,1.012,1.004); o.position.y=-0.03}

function facade(wm,hm,col,opt={}){const ppm=36,w=Math.round(wm*ppm),h=Math.round(hm*ppm);

      for(let c=0;c<cols;c++){if(opt.skip&&opt.skip(f,c))continue;const wx=c*cw+cw*0.22, ww=cw*0.56, wh=1.6*ppm;
        x.fillStyle='#e6e0d2';x.fillRect(wx-6,y0-6,ww+12,wh+12);

    // térreo: portas de aço enroladas + letreiro

    if(opt.sign!==false){const s=opt.sign||SIGNS[Math.floor(rnd()*SIGNS.length)], sy=gy+0.1*ppm;
      x.fillStyle=opt.signCol||['#1f4e79','#7a1f1f','#1f5e3a','#5a3a1f'][Math.floor(rnd()*4)];x.fillRect(w*0.08,sy,w*0.84,0.55*ppm);
      x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(w*0.08,sy,w*0.84,0.55*ppm);
      x.fillStyle='#f2ead8';x.font=`900 ${Math.round(0.4*ppm)}px Inter`;x.textAlign='center';x.textBaseline='middle';x.fillText(s,w/2,sy+0.29*ppm)}
    x.strokeStyle='#000';x.lineWidth=5;x.strokeRect(0,0,w,h)})}

    cyl(1.0,0.85,1.3,toon('#2f6fb0'),tx,hgt+1.15,tz,0.05); cyl(1.05,1.05,0.15,toon('#2a5f97'),tx,hgt+1.85,tz,0.04)}

const poleM=toon('#5d6470');
for(let z=2;z>-200;z-=24) for(const s of [-1,1]){ if(s>0&&z===2) continue;

function rig(t){
  const E=EV; let eye=CORNER.clone();
  const run=sm(E.corre,E.porta_fecha-0.3,t); eye.lerp(new THREE.Vector3(-10.6,1.62,-20.2),run);

  const running=t>E.corre&&t<E.porta_fecha;
  eye.y+= running?0.12*Math.abs(Math.sin(t*Math.PI*3.0)):0;
  let tg=ALLEY.clone();
  tg.lerp(new THREE.Vector3(9,0.9,-18.4),sm(E.flash1-3,E.flash1-2,t));     // aponta a câmera pro beco, mais baixo

  const c15=(EVF('15')); tg.lerp(EMERP,sm(c15,c15+0.8,t)*(1-sm(c15+3.2,c15+4.0,t)));

}

    tg.lerp(V(DX+1.3,1.7,5.0),sm(FI('18')-0.3,FI('18'),t)*(1-sm(E.olhos-0.3,E.olhos,t)));
    tg.lerp(V(DX,4.3,3.0),sm(E.olhos-0.3,E.olhos+0.3,t));
    tg.x+=0.12*Math.sin(t*1.3)+0.06*Math.sin(t*7); tg.y+=0.1*Math.sin(t*1.7)+0.05*Math.sin(t*8.9);
    return {eye:V(DX,1.62,7.2),tg,roll:0.02*Math.sin(t*0.9)};
  }
  let tg=DOORP.clone();
  tg.lerp(fp,sm(0.45,0.85,t)*(1-sm(FF('01')-0.1,FF('01')+0.4,t)));
  tg.lerp(bp,sm(E.entra,E.entra+0.5,t));
  tg.lerp(fp,sm(FI('04')+0.4,FI('04')+0.9,t));
  tg.lerp(bp,sm(FI('06')-0.2,FI('06')+0.1,t)*(1-sm(FI('07')-0.2,FI('07')+0.1,t)));
  tg.lerp(mid,sm(FI('08')-0.2,FI('08')+0.1,t));
  tg.lerp(bp,sm(FI('10')-0.2,FI('10')+0.1,t)*(1-sm(FI('11')-0.3,FI('11'),t)));
  tg.lerp(fp,sm(FI('11')-0.3,FI('11'),t));
  tg.y+=0.9*sm(E.transf0+0.5,E.transf1,t);                                        // ele cresce, a câmera sobe
  tg.lerp(FUNDOS,sm(E.corre-0.1,E.corre+0.3,t));
  tg.lerp(falsoPos(t).clone().setY(3.0),sm(E.flash-0.35,E.flash-0.05,t));          // olha pra trás no flash
  let eye=EYE.clone(); eye.lerp(V(-20.8,1.62,-21.8),sm(E.corre+0.3,E.flash-0.3,t));
  const run=t>E.corre+0.3&&t<E.flash; eye.y+=run?0.12*Math.abs(Math.sin(t*Math.PI*3)):0;
  const hook=t<E.abre?1:0, fear=t>E.transf0?1:0;
  tg.x+=0.18*Math.sin(t*1.3)+0.12*Math.sin(t*7.3)+hook*0.12*Math.sin(t*23)+fear*0.1*Math.sin(t*11); tg.y+=0.12*Math.sin(t*1.7+1)+0.08*Math.sin(t*8.9)+hook*0.08*Math.sin(t*19)+(run?0.25*Math.sin(t*9.4):0);
  return {eye,tg,roll:0.025*Math.sin(t*0.9)+(run?0.05*Math.sin(t*Math.PI*1.5):0)};
}

// ---------- primeiro plano ----------
const SKIN='#8f5232', SLEEVE='#46523a';
function poly(c,pts,fill,lw=5){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))c.lineTo(p[0],p[1]);c.closePath();
  if(fill){c.fillStyle=fill;c.fill()} if(lw){c.lineWidth=lw;c.strokeStyle='#000';c.lineJoin='round';c.stroke()}}
function rr(c,x,y,w,h,r,fill,lw=5){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle='#000';c.stroke()}}
function maoTrinco(c,t){const E=EV, u=1-sm(E.abre+0.3,E.abre+0.9,t); if(u<=0) return; const turn=sm(E.abre-0.5,E.abre-0.1,t);
  c.save();c.translate(lerp(820,560,u),lerp(1500,980,u));c.rotate(-0.5-0.5*turn);c.scale(2,2);
  poly(c,[[-60,260],[-50,70],[50,70],[60,260]],SLEEVE); rr(c,-50,-40,100,120,38,SKIN);
  for(const [fx,fh] of [[-40,70],[-14,84],[12,80],[36,66]]) rr(c,fx,-40-fh+30,22,fh,11,SKIN,4);
  rr(c,-70,0,26,60,13,SKIN,4); c.restore()}
function texto(c,t){
  const a=sm(0,0.15,t)*(1-sm(2.6,3.0,t));
  if(a>0){c.save();c.globalAlpha=a;c.textAlign='center';c.lineJoin='round';
    c.font='900 40px Inter';c.lineWidth=7;c.strokeStyle='#000';c.strokeText('VOCÊS ESCOLHERAM:',360,330);c.fillStyle='#FFD84D';c.fillText('VOCÊS ESCOLHERAM:',360,330);
    const s=lerp(1.25,1,sm(0,0.25,t));c.translate(360,392);c.scale(s,s);rr(c,-210,-42,420,84,20,'#2E6F8E',6);c.font='900 42px Inter';c.fillStyle='#fff';c.fillText('🚪 O DA PORTA',0,15);c.restore()}
  const E=EV, b=sm(E.deposito,E.deposito+0.3,t)*(1-sm(E.deposito+2.4,E.deposito+2.9,t));
  if(b>0){c.save();c.globalAlpha=b;c.textAlign='center';c.lineJoin='round';
    c.font='900 50px Inter';c.lineWidth=8;c.strokeStyle='#000';c.strokeText('MERCADO BOM PREÇO',360,560);c.fillStyle='#fff';c.fillText('MERCADO BOM PREÇO',360,560);
    c.font='900 40px Inter';c.strokeText('DEPÓSITO',360,615);c.fillStyle='#4dff88';c.fillText('DEPÓSITO',360,615);c.restore()}
}
function cta(c,u){
  c.fillStyle=`rgba(0,0,0,${0.5*sm(0,0.3,u)})`;c.fillRect(0,0,W,H);
  const a=sm(0.05,0.35,u), s=lerp(0.85,1,a); if(a<=0) return;
  c.save();c.globalAlpha=a;c.translate(360,700);c.scale(s,s);c.translate(-360,-700);c.textAlign='center';c.lineJoin='round';
  const txt=(t,y,size,col)=>{c.font=`900 ${size}px Inter`;c.lineWidth=size*0.16;c.strokeStyle='#000';c.strokeText(t,360,y);c.fillStyle=col;c.fillText(t,360,y)};
  txt('QUAL É A MÃE',470,62,'#ffffff'); txt('DE VERDADE?',545,62,'#ffffff');
  const btn=(y,col,label)=>{rr(c,60,y,600,100,22,col,6);c.font='900 34px Inter';c.fillStyle='#fff';c.fillText(label,360,y+62)};
  btn(610,'#2E6F8E','⬅️ A DO DEPÓSITO'); btn(740,'#C62828','➡️ A QUE CHAMA DE DUDU');
  txt('Comenta aqui 👇',920,40,'#FFD84D'); c.textAlign='left';c.restore();
}

// ---------- quadro ----------
window.setAmp=a=>{AMP=a};
window.draw=function(tt){
  const E=EV, t=Math.min(tt,E.cta);
  const zoom=sm(FI('05')-0.3,FI('05')+0.4,t)*(1-sm(FI('06')-0.3,FI('06'),t))+sm(FI('11')-0.3,FI('11')+0.3,t)*(1-sm(E.transf0+0.4,E.transf0+1.2,t));
  CAM.fov=lerp(lerp(88,52,zoom),68,sm(E.transf0+0.6,E.transf0+1.4,t)*(1-sm(E.corre-0.3,E.corre,t))); CAM.updateProjectionMatrix();
  const k=rig(t); CAM.position.copy(k.eye); CAM.up.set(Math.sin(k.roll),Math.cos(k.roll),0); CAM.lookAt(k.tg);
  CIDA.visible=false; FLAME.visible=false; CANDLE.intensity=0; COISA.visible=false; LANT.intensity=0; HEMI.intensity=0.08; MOON.intensity=0.05;
  // luz de emergência: normal, pisca a partir do "foi... foi...", estrobo na transformação
  let em=1;
  if(t>E.pisca){const n=Math.sin(t*37)+Math.sin(t*13.7)+Math.sin(t*5.3); em=n>1.9?0.1:0.85}
  if(t>E.transf0&&t<E.transf1+1){const q=(t-E.transf0)/((E.transf1-E.transf0)/5); em=(q%1)<0.22?0.03:0.9}
  if(t>E.transf1+1) {const n=Math.sin(t*29)+Math.sin(t*11.3); em=n>1.2?0.05:0.6}
  EMER.intensity=em*(4.2+0.25*Math.sin(t*50)); lampM.color.set(em>0.4?'#ffffff':'#3a3a3a'); LEDb.material.color.set(t>E.pisca?'#ff3030':'#ffcc33');
  // porta da frente
  DOOR.rotation.y=-sm(E.abre,E.abre+0.5,t)*(1-sm(E.fecha-0.3,E.fecha+0.1,t))*1.25; DOOR.position.x=-11.1+(t<E.abre-0.2?0.025*Math.sin(t*38):0);
  // FALSO / MONSTRO
  const st=stage(t), af=amp('falso',t);
  BIEL.visible=t<E.corte+0.1; BIEL.position.copy(falsoPos(t));
  const lk=new THREE.Vector3().subVectors(CAM.position,BIEL.position); BIEL.rotation.set(0,Math.atan2(lk.x,lk.z),0);
  const esc=[0,0.5,1,1,1,1][st]; for(const [m,c0] of CORES) m.color.copy(c0).lerp(new THREE.Color('#060608'),esc);
  BIEL.scale.set(st>=2?0.85:1, st>=2?1.5:(st>=1?1.08:1), st>=2?0.85:1);
  for(const a of BARM){a.scale.y=st>=3?2.1:1; a.rotation.x=st>=3?0.15:0.05; a.rotation.z=0}
  PERNAS.scale.setScalar(st>=4?1+0.06*Math.sin(t*9):0.001); PERNAS.rotation.x=st>=4?0.08*Math.sin(t*6):0;
  const glitch=(t>FI('11')&&t<FF('12'))?1:0;
  BH.rotation.set(0.05+(st>=2?0.35:0)+glitch*0.15*Math.sin(t*41), glitch*0.3*Math.sin(t*23), (st>=2?0.4:0)+glitch*0.2*Math.sin(t*31));
  for(const g of OL1){g.scale.y=1.15; g.children.forEach(m=>{if(m.isMesh&&m.material!==INK){m.material.emissive=new THREE.Color(st>=5?'#ffffff':'#000000')}})}
  for(const p of PU1) p.visible=st<5;
  BMOUTH.scale.set(1+af*0.4+(st>=2?0.8:0),0.3+af*1.5+(st>=2?0.5:0),0.6);
  // BIEL DE VERDADE (em pé, pisca muito)
  BIEL2.visible=t<E.corte+0.1||t>=E.deposito; 
  let bp=bielPos(t); if(t>=E.deposito) bp=V(DX+1.3,0.26,5.0); BIEL2.position.copy(bp);
  const alvo=(t>FI('04')&&t<E.corre)?BIEL.position:CAM.position; const lk2=new THREE.Vector3().subVectors(alvo,BIEL2.position);
  BIEL2.rotation.y=t>E.corre&&t<E.corte?-Math.PI/2:Math.atan2(lk2.x,lk2.z); BIEL2.position.y+=0.03*Math.sin(t*9)*(t>E.entra?1:0);
  BARM2.forEach((a,i)=>{a.rotation.x=(t<E.abre&&i===1)?-2.3+0.6*Math.sin(t*14):0.05});
  const pis=((t*1.15)%1)<0.1; for(const o of OL2) o.scale.y=pis?0.12:1.15; for(const p of PU2) p.visible=!pis;
  BM2.scale.set(1+amp('biel',t)*0.4,0.3+amp('biel',t)*1.5,0.6);
  OLHOSTETO.visible=t>=E.olhos; OLHOSTETO.children.slice(1,3).forEach(e=>e.scale.y=0.7*sm(E.olhos,E.olhos+0.3,t)+0.01);
  FLASH.position.copy(k.eye); FLASH.intensity=(t>=E.flash&&t<E.flash+0.14)?22*(1-(t-E.flash)/0.14):0;
  R.render(S,CAM); O.drawImage(R.domElement,0,0);
  if(t>=E.flash&&t<E.flash+0.25){O.fillStyle=`rgba(255,255,255,${0.55*(1-(t-E.flash)/0.25)})`;O.fillRect(0,0,W,H)}
  if(t>=E.corte&&t<E.deposito){O.fillStyle='#000';O.fillRect(0,0,W,H)}
  maoTrinco(O,t); texto(O,t);
  if(tt>=E.cta) cta(O,tt-E.cta);
  return OUT.toDataURL('image/jpeg',0.92);
};

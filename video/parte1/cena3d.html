const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u;

function tex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep)}return t}
function box(w,h,d,mat,x,y,z,ink=0.06,parent=S){const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); g.add(m);

  map:tex(1024,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#03050b');g.addColorStop(0.42,'#0b1222');g.addColorStop(0.5,'#1c2540');g.addColorStop(1,'#05070c');

for(const s of [-1,1]){const yl=new THREE.Mesh(new THREE.PlaneGeometry(0.18,226),toon('#e0b43a'));yl.rotation.x=-Math.PI/2;yl.position.set(s*7.6,0.01,-109);S.add(yl)}
const calc=tex(256,256,(x,w,h)=>{x.fillStyle='#8d8f97';x.fillRect(0,0,w,h);x.strokeStyle='#5a5c64';x.lineWidth=3;

  for(let i=0;i<900;i++){x.fillStyle='rgba(0,0,0,0.06)';x.fillRect(rnd()*w,rnd()*h,2,2)}});

  box(6,y,STEP_D,stepMat,0,y/2,z+STEP_D/2,0.035); box(6.02,0.06,0.12,edgeMat,0,y-0.03,z+0.06,0)}

function mureta(xc){const zt=Z0+STEP_N*STEP_D, top=STEP_N*STEP_H;
  const sh=new THREE.Shape([new THREE.Vector2(Z0-0.4,0),new THREE.Vector2(Z0-0.4,0.8),new THREE.Vector2(zt,top+0.8),new THREE.Vector2(zt+6,top+0.8),new THREE.Vector2(zt+6,0)]);
  const mk=(th,mat)=>{const g=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:false});const m=new THREE.Mesh(g,mat);
    m.rotation.y=-Math.PI/2; m.position.set(xc+th/2,0,0); S.add(m); return m};
  mk(0.45,toon({map:conc})); const o=mk(0.57,INK); o.scale.set(1,1.012,1.004); o.position.y=-0.03}
for(const s of [-1,1]){mureta(s*3.25);
  // corrimão

const SIGNS=['PADARIA','FARMÁCIA','ÓTICA','SALÃO','MERCADINHO','LANCHES','CHAVEIRO','ACADEMIA','BAZAR','PAPELARIA'];
function facade(wm,hm,col,opt={}){const ppm=36,w=Math.round(wm*ppm),h=Math.round(hm*ppm);
  return tex(w,h,(x)=>{x.fillStyle=col;x.fillRect(0,0,w,h);
    for(let i=0;i<w*h/400;i++){x.fillStyle='rgba(0,0,0,0.05)';x.fillRect(rnd()*w,rnd()*h,3,3)}
    const floors=Math.floor((hm-0.6)/3.1), cols=Math.max(1,Math.floor(wm/3.4)), cw=w/cols;
    for(let f=1;f<floors;f++){const y0=h-(f+1)*3.1*ppm+0.9*ppm;
      x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(0,h-f*3.1*ppm-6,w,6);
      for(let c=0;c<cols;c++){if(opt.skip&&opt.skip(f,c))continue;const wx=c*cw+cw*0.22, ww=cw*0.56, wh=1.6*ppm;

        x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(wx-6,y0-6,ww+12,wh+12);x.strokeRect(wx,y0,ww,wh);
        x.beginPath();x.moveTo(wx+ww/2,y0);x.lineTo(wx+ww/2,y0+wh);x.stroke();
        x.fillStyle='#d9d2c2';x.fillRect(wx-10,y0+wh+6,ww+20,8);x.strokeRect(wx-10,y0+wh+6,ww+20,8);
        if(rnd()<0.3){x.fillStyle='#2b3040';x.fillRect(wx+ww*0.1,y0+wh+14,ww*0.8,0.5*ppm);x.strokeRect(wx+ww*0.1,y0+wh+14,ww*0.8,0.5*ppm)}}}
    // térreo: portas de aço enroladas + letreiro
    const gy=h-3.1*ppm;x.fillStyle='#3b4150';x.fillRect(0,gy,w,10);
    const nd=Math.max(1,Math.floor(wm/5)), dw=w/nd;
    for(let d=0;d<nd;d++){const dx=d*dw+dw*0.1, ddw=dw*0.8, dy=gy+0.75*ppm;
      x.fillStyle='#a3a7b0';x.fillRect(dx,dy,ddw,h-dy);x.strokeStyle='#5d616b';x.lineWidth=2;
      for(let yy=dy+8;yy<h;yy+=9){x.beginPath();x.moveTo(dx,yy);x.lineTo(dx+ddw,yy);x.stroke()}
      x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(dx,dy,ddw,h-dy);
      scribble(x,ddw,h-dy,2,'rgba(20,20,25,0.5)',3)}
    if(opt.sign!==false){const s=opt.sign||SIGNS[Math.floor(rnd()*SIGNS.length)], sy=gy+0.1*ppm;
      x.fillStyle=opt.signCol||['#1f4e79','#7a1f1f','#1f5e3a','#5a3a1f'][Math.floor(rnd()*4)];x.fillRect(w*0.08,sy,w*0.84,0.55*ppm);
      x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(w*0.08,sy,w*0.84,0.55*ppm);
      x.fillStyle='#f2ead8';x.font=`900 ${Math.round(0.4*ppm)}px Inter`;x.textAlign='center';x.textBaseline='middle';x.fillText(s,w/2,sy+0.29*ppm)}
    x.strokeStyle='#000';x.lineWidth=5;x.strokeRect(0,0,w,h)})}
function building(side,z0,len,hgt,col,opt={}){
  const dep=12, xC=side*(11+dep/2), f=facade(len,hgt,col,opt), plain=toon(col);
  const mats=[plain,plain,toon('#4b4e57'),plain,plain,plain]; mats[side>0?1:0]=toon({map:f});
  const g=box(dep,hgt,len,mats,xC,hgt/2,z0-len/2,0.07);
  box(dep+0.4,0.5,len+0.4,toon('#d6cfbf'),xC,hgt+0.25,z0-len/2,0.05);              // platibanda

    cyl(1.0,0.85,1.3,toon('#2f6fb0'),tx,hgt+1.15,tz,0.05); cyl(1.05,1.05,0.15,toon('#2a5f97'),tx,hgt+1.85,tz,0.04)}
  if(rnd()<0.5){cyl(0.04,0.04,3,toon('#333'),xC+side*-3,hgt+1.5,z0-len*0.7,0.02)}
  return g}

for(const s of [-1,1]){const e=ball(0.105,toon('#f7f3ea'),s*0.15,0.05,0.35,0.018,HEAD);e.scale.set(1,1.1,0.55);eyes.push(e);

  const g=new THREE.Mesh(new THREE.TorusGeometry(0.13,0.018,8,24),new THREE.MeshBasicMaterial({color:'#151515'}));g.position.set(s*0.15,0.05,0.4);HEAD.add(g);

const CANDLE=new THREE.PointLight('#ffa552',0,9,1.4); S.add(CANDLE);

// ---------- luzes ----------
S.add(new THREE.HemisphereLight('#41507e','#0a0c12',1.05));
const moon=new THREE.DirectionalLight('#9fb4e6',0.55); moon.position.set(-30,60,25); S.add(moon);
const LANT=new THREE.SpotLight('#eef4ff',0,70,0.36,0.55,1.0); S.add(LANT); S.add(LANT.target);

// ---------- câmera / roteiro de movimento ----------
const STAIR_TOP=STEP_N*STEP_H;
function stairY(z){return cl((z-Z0)/(STEP_N*STEP_D))*STAIR_TOP}
const WINDOW=new THREE.Vector3(FX-0.3,WY+0.6,WZ);
function rig(t){
  // trajeto: topo da escada → desce (11,5–18) → anda até embaixo da janela (18,3–24)
  let ex=0.6, ez=16.2;
  const d=sm(11.4,18.0,t); ex=lerp(ex,2.2,d); ez=lerp(ez,4.4,d);
  const w=sm(18.3,24.0,t); ex=lerp(ex,6.6,w); ez=lerp(ez,0.6,w);
  const walking=(t>11.4&&t<18)||(t>18.3&&t<24);
  const bob=walking?0.07*Math.abs(Math.sin(t*Math.PI*1.9)):0;
  const ey=1.62+(ez>Z0?stairY(ez):0)+bob;
  // para onde olha
  let tg=new THREE.Vector3(0+6*Math.sin(t*0.35),3.2,-60);
  const sw=sm(6.0,6.8,t)*(1-sm(7.9,8.6,t)); tg.x+=sw*22*Math.sin((t-6)*2.6);
  const toW=sm(8.7,10.8,t); tg.lerp(WINDOW,toW);
  const dn=sm(11.4,12.4,t)*(1-sm(14.0,15.0,t)); tg.y-=dn*3.5;               // olha os degraus ao descer
  const sh=sm(24.5,24.8,t)*(1-sm(25.9,26.5,t));
  tg.x+=0.25*Math.sin(t*1.3)+0.12*Math.sin(t*2.9)+sh*0.5*Math.sin(t*9.1);
  tg.y+=0.2*Math.sin(t*1.7+1)+0.1*Math.sin(t*3.7)+sh*0.35*Math.sin(t*11.3);
  return {eye:new THREE.Vector3(ex,ey,ez),tg,roll:0.025*Math.sin(t*0.9)+(walking?0.02*Math.sin(t*Math.PI*0.95):0)};
}
function beamTarget(t){
  let p=new THREE.Vector3(lerp(0.5,-1,sm(5.3,6,t)),0,lerp(-2,-6,sm(5.3,6,t)));
  const sw=sm(6.0,6.8,t)*(1-sm(7.9,8.6,t)); p.x+=sw*7*Math.sin((t-6)*2.6+0.4);
  p.lerp(new THREE.Vector3(10.6,1.2,-3),sm(8.8,10.4,t));
  p.lerp(new THREE.Vector3(10.5,7.2,-3),sm(12.9,14.3,t));
  p.x+=0.15*Math.sin(t*2.3); p.y+=0.12*Math.sin(t*3.1); return p;
}

// ---------- mãos e objetos em primeiro plano (2D, contorno grosso) ----------
const SKIN='#8f5232', SKIN2='#6b3a22', SLEEVE='#46523a';
function poly(c,pts,fill,lw=5){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))c.lineTo(p[0],p[1]);c.closePath();
  if(fill){c.fillStyle=fill;c.fill()} if(lw){c.lineWidth=lw;c.strokeStyle='#000';c.lineJoin='round';c.stroke()}}
function rr(c,x,y,w,h,r,fill,lw=5){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(lw){c.lineWidth=lw;c.strokeStyle='#000';c.stroke()}}
function fist(c,x,y,s,flip){c.save();c.translate(x,y);c.scale(flip?-s:s,s);
  poly(c,[[-62,330],[-48,95],[44,95],[58,330]],SLEEVE); c.strokeStyle='#2c3524';c.lineWidth=3;c.beginPath();c.moveTo(-40,140);c.lineTo(40,140);c.stroke();
  rr(c,-48,-30,96,130,38,SKIN);
  for(const yy of [-22,8,38,68]){rr(c,30,yy,40,30,15,SKIN,4)}
  c.strokeStyle=SKIN2;c.lineWidth=3;c.beginPath();c.arc(-10,40,24,-0.6,0.6);c.stroke();c.restore()}
let SNAP=null; const LIVE=document.createElement('canvas');LIVE.width=W;LIVE.height=H;
function cameraProp(c,t){
  const down=sm(4.7,5.5,t); if(down>=1) return;
  const x0=190, y0=900+down*620, sw=Math.sin(t*1.4)*6;
  c.save(); c.translate(sw,0);
  c.strokeStyle='#000';c.lineWidth=14;c.beginPath();c.moveTo(x0+20,y0+70);c.quadraticCurveTo(x0-50,y0+270,x0+10,1420);c.stroke();
  c.strokeStyle='#8a2f2f';c.lineWidth=8;c.stroke();
  rr(c,x0-10,y0,350,210,26,'#26272c',6); rr(c,x0+120,y0-44,110,52,10,'#26272c',6);
  rr(c,x0+20,y0+26,220,158,10,'#000',4);
  const img=(t>=0.62&&t<2.8&&SNAP)?SNAP:LIVE; c.drawImage(img,110,250,500,360,x0+26,y0+32,208,146);
  if(t>=0.6&&t<0.68){c.fillStyle='rgba(255,255,255,0.85)';c.fillRect(x0+26,y0+32,208,146)}
  c.fillStyle='#f2f2f2';c.font='800 14px Inter';c.fillText(t>=0.62&&t<2.8?'▶ IMG_0347':'● REC  AUTO',x0+34,y0+52);
  for(const [bx,by] of [[x0+282,y0+70],[x0+282,y0+128],[x0+316,y0+99]]){c.beginPath();c.arc(bx,by,15,0,7);c.fillStyle='#3a3c43';c.fill();c.lineWidth=4;c.strokeStyle='#000';c.stroke()}
  fist(c,x0-6,y0+120,1.05,false); fist(c,x0+346,y0+120,1.05,true);
  c.restore();
}
function phoneProp(c,t,bs){
  const up=sm(5.0,5.7,t); if(up<=0) return [470,1000];
  const lift=bs?cl(-(bs[1]-700)*0.10,-40,60):0, tilt=-0.16+(bs?cl((bs[0]-360)*0.0004,-0.15,0.15):0);
  const x=480+Math.sin(t*1.2)*5, y=lerp(1500,975,up)+lift*sm(5.7,6.2,t)+Math.sin(t*1.6)*5+(Math.abs(Math.sin(t*Math.PI*1.9))*12*((t>11.4&&t<18)||(t>18.3&&t<24)?1:0));
  c.save();c.translate(x,y);c.rotate(tilt);
  rr(c,-98,-12,196,350,26,'#15161a',6);
  const sc=c.createLinearGradient(0,0,0,330);sc.addColorStop(0,'#24365a');sc.addColorStop(1,'#0e1628');rr(c,-86,2,172,320,18,null,0);c.fillStyle=sc;c.fill();
  c.textAlign='left';c.fillStyle='#e6ecf6';c.font='700 13px Inter';c.fillText('23:47',-72,24);
  c.fillStyle='#ff4747';c.font='900 14px Inter';c.fillText('3%',34,24);c.strokeStyle='#ff4747';c.lineWidth=2;c.strokeRect(58,13,20,11);c.fillRect(59,14,3,9);
  c.textAlign='center';c.fillStyle='#eef2fa';c.font='300 54px Inter';c.fillText('23:47',0,100);
  c.font='600 14px Inter';c.fillText('qui., 26 de novembro',0,124);
  c.font='700 12px Inter';c.fillStyle='rgba(255,255,255,0.7)';c.fillText('Sem serviço',0,146);
  const on=t>=5.3;c.beginPath();c.arc(-46,284,25,0,7);c.fillStyle=on?'#f6f8ff':'rgba(255,255,255,0.2)';c.fill();
  c.font='22px Inter';c.fillStyle='#000';c.fillText('🔦',-46,292);
  c.beginPath();c.arc(46,284,25,0,7);c.fillStyle='rgba(255,255,255,0.2)';c.fill();c.fillText('📷',46,292);
  c.textAlign='left';
  // mão
  poly(c,[[-125,150],[-104,60],[-84,64],[-84,330],[-60,440],[-130,440]],SKIN);
  for(const yy of [130,182,234,282]) rr(c,78,yy,44,34,16,SKIN,5);
  poly(c,[[-150,340],[120,340],[150,640],[-180,640]],SLEEVE);
  c.restore(); return [x,y];
}

// ---------- quadro ----------
window.setAmp=a=>{AMP=a};
window.draw=function(t){
  const k=rig(t); CAM.fov=lerp(lerp(95,58,sm(18.3,24.0,t)),66,sm(24.5,25.2,t)); CAM.updateProjectionMatrix(); CAM.position.copy(k.eye); CAM.up.set(Math.sin(k.roll),Math.cos(k.roll),0); CAM.lookAt(k.tg);
  // Dona Cida entra na janela quando acende a vela
  const appear=sm(8.2,8.9,t), talk=amp('cida',t);
  CIDA.position.set(FX+0.9-1.2*appear,WY+0.36,WZ); CIDA.rotation.y=-Math.PI/2; CIDA.scale.setScalar(1.12);
  const look=new THREE.Vector3().subVectors(CAM.position,new THREE.Vector3(CIDA.position.x,CIDA.position.y+0.55,WZ));
  HEAD.rotation.y=cl(Math.atan2(look.z,-look.x)*0.9,-0.9,0.9)*appear; HEAD.rotation.x=cl(-Math.atan2(look.y,Math.hypot(look.x,look.z))*0.7,-0.6,0.5);
  HEAD.rotation.z=0.06*Math.sin(t*0.8);
  const lean=sm(14.6,15.4,t); CIDA.rotation.z=-0.12*lean;
  const blink=((t%4.3)<0.12||(t%7.1)<0.1)?0.12:1; for(const e of eyes)e.scale.y=1.1*blink; for(const p of pup)p.scale.y=blink;
  MOUTH.scale.set(1+talk*0.5,0.35+talk*1.6,0.6);
  const lit=sm(8.45,9.1,t), fl=1+0.1*Math.sin(t*23)+0.07*Math.sin(t*37.3+1);
  FLAME.visible=t>8.45; FLAME.scale.setScalar(Math.max(0.2,lit)*fl);
  CIDA.updateMatrixWorld(true); FLAME.getWorldPosition(CANDLE.position); CANDLE.intensity=lit*7*fl;
  // lanterna
  const on=t>=5.3?1:0; LANT.intensity=on*55;
  LANT.position.copy(k.eye).add(new THREE.Vector3(0.25,-0.35,0).applyQuaternion(CAM.quaternion));
  const bt=beamTarget(t); LANT.target.position.copy(bt); LANT.target.updateMatrixWorld();
  R.render(S,CAM);
  O.drawImage(R.domElement,0,0);
  // feixe de luz no ar
  let bs=null;
  if(on){const v=bt.clone().project(CAM); bs=[(v.x+1)/2*W,(1-v.y)/2*H];
    if(v.z<1){O.globalCompositeOperation='lighter';const px=480,py=1000;
      const g=O.createLinearGradient(px,py,bs[0],bs[1]);g.addColorStop(0,'rgba(200,215,255,0.13)');g.addColorStop(1,'rgba(200,215,255,0.0)');
      O.fillStyle=g;O.beginPath();O.moveTo(px-14,py);O.lineTo(bs[0]-150,bs[1]);O.lineTo(bs[0]+150,bs[1]);O.lineTo(px+14,py);O.fill();
      O.globalCompositeOperation='source-over'}}
  const lv=LIVE.getContext('2d'); lv.drawImage(OUT,0,0);
  if(t>=0.62&&!SNAP){SNAP=document.createElement('canvas');SNAP.width=W;SNAP.height=H;SNAP.getContext('2d').drawImage(OUT,0,0)}
  cameraProp(O,t); phoneProp(O,t,bs);
  return OUT.toDataURL('image/jpeg',0.92);
};
await document.fonts.ready; window.READY=true;
</script></body></html>

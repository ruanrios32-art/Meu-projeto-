const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u;

const grad=new THREE.DataTexture(new Uint8Array([55,120,200,255]),4,1,THREE.RedFormat);

const INK=new THREE.MeshBasicMaterial({color:'#000',side:THREE.BackSide});

function tex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep)}return t}
function box(w,h,d,mat,x,y,z,ink=0.06,parent=CUR){const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); g.add(m);

  mk(0.45,toon({map:conc})); const o=mk(0.57,INK); o.scale.set(1,1.012,1.004); o.position.y=-0.03}

const SIGNS=['PADARIA','FARMÁCIA','ÓTICA','SALÃO','MERCADINHO','LANCHES','CHAVEIRO','ACADEMIA','BAZAR','PAPELARIA'];
function facade(wm,hm,col,opt={}){const ppm=36,w=Math.round(wm*ppm),h=Math.round(hm*ppm);

    for(let i=0;i<w*h/400;i++){x.fillStyle='rgba(0,0,0,0.05)';x.fillRect(rnd()*w,rnd()*h,3,3)}
    const floors=Math.floor((hm-0.6)/3.1), cols=Math.max(1,Math.floor(wm/3.4)), cw=w/cols;
    for(let f=1;f<floors;f++){const y0=h-(f+1)*3.1*ppm+0.9*ppm;
      x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(0,h-f*3.1*ppm-6,w,6);
      for(let c=0;c<cols;c++){if(opt.skip&&opt.skip(f,c))continue;const wx=c*cw+cw*0.22, ww=cw*0.56, wh=1.6*ppm;
        x.fillStyle='#e6e0d2';x.fillRect(wx-6,y0-6,ww+12,wh+12);

        x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(wx-6,y0-6,ww+12,wh+12);x.strokeRect(wx,y0,ww,wh);
        x.beginPath();x.moveTo(wx+ww/2,y0);x.lineTo(wx+ww/2,y0+wh);x.stroke();
        x.fillStyle='#d9d2c2';x.fillRect(wx-10,y0+wh+6,ww+20,8);x.strokeRect(wx-10,y0+wh+6,ww+20,8);
        if(rnd()<0.3){x.fillStyle='#2b3040';x.fillRect(wx+ww*0.1,y0+wh+14,ww*0.8,0.5*ppm);x.strokeRect(wx+ww*0.1,y0+wh+14,ww*0.8,0.5*ppm)}}}
    // térreo: portas de aço enroladas + letreiro
    const gy=h-3.1*ppm;x.fillStyle='#3b4150';x.fillRect(0,gy,w,10);
    const nd=Math.max(1,Math.floor(wm/5)), dw=w/nd;
    for(let d=0;d<nd;d++){const dx=d*dw+dw*0.1, ddw=dw*0.8, dy=gy+0.75*ppm;
      x.fillStyle='#a3a7b0';x.fillRect(dx,dy,ddw,h-dy);x.strokeStyle='#5d616b';x.lineWidth=2;
      for(let yy=dy+8;yy<h;yy+=9){x.beginPath();x.moveTo(dx,yy);x.lineTo(dx+ddw,yy);x.stroke()}
      x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(dx,dy,ddw,h-dy);
      scribble(x,ddw,h-dy,2,'rgba(20,20,25,0.5)',3)}
    if(opt.sign!==false){const s=opt.sign||SIGNS[Math.floor(rnd()*SIGNS.length)], sy=gy+0.1*ppm;
      x.fillStyle=opt.signCol||['#1f4e79','#7a1f1f','#1f5e3a','#5a3a1f'][Math.floor(rnd()*4)];x.fillRect(w*0.08,sy,w*0.84,0.55*ppm);
      x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(w*0.08,sy,w*0.84,0.55*ppm);
      x.fillStyle='#f2ead8';x.font=`900 ${Math.round(0.4*ppm)}px Inter`;x.textAlign='center';x.textBaseline='middle';x.fillText(s,w/2,sy+0.29*ppm)}
    x.strokeStyle='#000';x.lineWidth=5;x.strokeRect(0,0,w,h)})}
function building(side,z0,len,hgt,col,opt={}){
  const dep=12, xC=side*(11+dep/2), f=facade(len,hgt,col,opt), plain=toon(col);
  const mats=[plain,plain,toon('#4b4e57'),plain,plain,plain]; mats[side>0?1:0]=toon({map:f});

  box(dep+0.4,0.5,len+0.4,toon('#d6cfbf'),xC,hgt+0.25,z0-len/2,0.05);              // platibanda
  if(rnd()<0.75){const tx=xC+(rnd()-.5)*6,tz=z0-len*(0.2+rnd()*0.6);                // caixa d'água azul
    cyl(1.0,0.85,1.3,toon('#2f6fb0'),tx,hgt+1.15,tz,0.05); cyl(1.05,1.05,0.15,toon('#2a5f97'),tx,hgt+1.85,tz,0.04)}
  if(rnd()<0.5){cyl(0.04,0.04,3,toon('#333'),xC+side*-3,hgt+1.5,z0-len*0.7,0.02)}
  return g}

const poleM=toon('#5d6470');
for(let z=2;z>-200;z-=24) for(const s of [-1,1]){ if(s>0&&z===2) continue;
  cyl(0.14,0.18,9,poleM,s*8.6,4.5,z+(s>0?0:12),0.04); box(1.8,0.12,0.12,poleM,s*8.6,8.4,z+(s>0?0:12),0.03)}

const CAR1=car(6.2,-9.5,'#9b2f2f'); {const d=box(0.08,0.72,1.05,toon('#9b2f2f'),-1.45,1.0,1.0,0.03,CAR1);d.rotation.y=0.85;}

  const sh=box(0.06,1.8,0.85,toon({map:tex(64,128,(x,w,h)=>{x.fillStyle='#3f6a4a';x.fillRect(0,0,w,h);x.strokeStyle='#1f3626';x.lineWidth=3;

// ---------- DONA CIDA (estilo cartoon: cabeça grande, olhos grandes) ----------

ball(0.42,skin,0,0,0,0.03,HEAD,32);

// braço e vela

<!doctype html><html><head><meta charset="utf-8"><title>Foto de perfil</title><style>body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas><script>
// Foto de perfil — NÃO RESPONDE. window.pinta(comTexto)
const C=document.getElementById('c'), x=C.getContext('2d'), W=1080;
function pinta(texto){
  x.setTransform(1,0,0,1,0,0);
  // fundo noite do apagão
  const g=x.createRadialGradient(540,430,40,540,520,760); g.addColorStop(0,'#2a3658'); g.addColorStop(0.45,'#141c33'); g.addColorStop(1,'#05070d');
  x.fillStyle=g; x.fillRect(0,0,W,W);
  // facho da lanterna (círculo de luz atrás da figura)
  const cy=texto?440:500;
  const l=x.createRadialGradient(540,cy,30,540,cy,380); l.addColorStop(0,'rgba(225,235,255,0.95)'); l.addColorStop(0.55,'rgba(200,215,250,0.55)'); l.addColorStop(1,'rgba(200,215,250,0)');
  x.fillStyle=l; x.beginPath(); x.arc(540,cy,380,0,7); x.fill();
  // rachaduras no chão/parede iluminada
  x.strokeStyle='rgba(30,35,50,0.35)'; x.lineWidth=6; x.lineCap='round';
  for(const [sx,sy] of [[300,300],[760,330],[330,640],[770,600]]){x.beginPath();x.moveTo(sx,sy);let px=sx,py=sy;for(let i=0;i<4;i++){px+=Math.sin(i*2.1+sx)*40;py+=28;x.lineTo(px,py)}x.stroke()}
  // silhueta (cabeça + ombros), contorno grosso estilo cartoon
  x.save(); x.translate(540,cy+(texto?10:30)); const s=texto?0.92:1.05; x.scale(s,s);
  x.lineJoin='round';
  const corpo=()=>{x.beginPath();x.moveTo(-250,700);x.lineTo(-250,420);x.bezierCurveTo(-250,250,-170,175,-80,160);x.lineTo(80,160);x.bezierCurveTo(170,175,250,250,250,420);x.lineTo(250,700);x.closePath()};
  const cab=()=>{x.beginPath();x.ellipse(0,-30,118,150,0,0,7)};
  x.fillStyle='#04050a'; x.strokeStyle='#000'; x.lineWidth=18;
  corpo(); x.stroke(); x.fill(); cab(); x.stroke(); x.fill();
  // pescoço
  x.fillRect(-48,90,96,90);
  // leve contorno de luz (luz de fundo)
  x.strokeStyle='rgba(120,140,190,0.55)'; x.lineWidth=5; cab(); x.stroke();
  // olhos claros (brilho)
  for(const ex of [-44,44]){
    x.save(); x.shadowColor='rgba(235,242,255,1)'; x.shadowBlur=40; x.fillStyle='#f2f6ff';
    x.beginPath(); x.ellipse(ex,-40,24,11,ex<0?0.12:-0.12,0,7); x.fill(); x.restore();
  }
  x.restore();
  // vinheta
  const v=x.createRadialGradient(540,540,380,540,540,780); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.75)'); x.fillStyle=v; x.fillRect(0,0,W,W);
  if(texto){
    x.textAlign='center'; x.lineJoin='round';
    // faixa vermelha estilo selo
    x.fillStyle='#C62828'; x.strokeStyle='#000'; x.lineWidth=12;
    x.beginPath(); x.roundRect(205,770,670,150,24); x.fill(); x.stroke();
    x.font='900 92px Inter'; x.fillStyle='#ffffff'; x.lineWidth=14; x.strokeText('NÃO',540,858-22); 
    x.font='900 64px Inter';
    x.font='900 88px Inter'; x.fillText('NÃO',540,836);
    x.font='900 58px Inter'; x.lineWidth=10; x.strokeText('RESPONDE',540,900); x.fillText('RESPONDE',540,900);
  }
  return C.toDataURL('image/png');
}
window.pinta=pinta;
</script></body></html>

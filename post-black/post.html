<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFC93C;--gold2:#E89F00;--green:#7BC043;--ink:#0b0b0b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink)}
.poster{position:relative;overflow:hidden;color:#fff;font-family:Poppins,sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#2a2208 0%,#0b0b0b 55%),#0b0b0b;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.poster::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,201,60,.04) 0 2px,transparent 2px 28px);}
.frame{position:absolute;inset:var(--fr);border:3px solid var(--gold);border-radius:28px;pointer-events:none}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,201,60,.35);border-radius:20px}
.ribbon{position:relative;font-weight:800;letter-spacing:.25em;font-size:var(--rib);
  background:var(--gold);color:#111;padding:.45em 1.4em;border-radius:999px;margin-top:var(--top)}
.small{position:relative;font-family:Pacifico,cursive;color:var(--gold);font-size:var(--sm);margin-top:var(--g1);line-height:1.3;margin-bottom:calc(var(--g1) * .6)}
h1{position:relative;font-family:Anton,sans-serif;font-weight:400;line-height:.88;font-size:var(--h1);
  letter-spacing:.02em;text-transform:uppercase}
h1 .b{display:block;color:#fff}
h1 .k{display:block;font-size:1.25em;background:linear-gradient(180deg,#FFE08A,var(--gold) 45%,var(--gold2));
  -webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6))}
.corn{position:relative;font-size:var(--corn);line-height:1;margin:var(--g1) 0 0;letter-spacing:.2em}
.menu{position:relative;width:var(--mw);margin-top:var(--g2);display:flex;flex-direction:column;gap:var(--gap)}
.item{display:flex;align-items:center;gap:.6em;font-size:var(--fs);padding:.42em .5em .42em .9em;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,201,60,.25);border-radius:18px;text-align:left}
.item .n{font-weight:700;line-height:1.1}
.item .n small{display:block;font-weight:500;font-size:.62em;color:#cfc6a8;margin-top:.15em}
.item .dots{flex:1;border-bottom:3px dotted rgba(255,201,60,.45);transform:translateY(-.2em);min-width:20px}
.price{background:var(--gold);color:#111;font-weight:800;border-radius:14px;padding:.18em .55em;white-space:nowrap;
  box-shadow:0 5px 0 var(--gold2)}
.price span{font-size:.55em;vertical-align:.55em;margin-right:.15em}
.foot{position:relative;margin-top:auto;margin-bottom:var(--bot);font-size:var(--ft);font-weight:700}
.foot b{color:var(--gold)}
.foot .sub{display:block;font-weight:500;color:#cfc6a8;font-size:.7em;margin-top:.3em}
/* formatos */
.story{width:1080px;height:1920px;--fr:36px;--top:150px;--rib:30px;--sm:64px;--g1:28px;--h1:200px;--corn:90px;
  --g2:50px;--mw:900px;--gap:26px;--fs:44px;--ft:44px;--bot:150px}
.feed{width:1080px;height:1350px;--fr:28px;--top:80px;--rib:24px;--sm:50px;--g1:12px;--h1:140px;--corn:56px;
  --g2:30px;--mw:920px;--gap:16px;--fs:34px;--ft:32px;--bot:70px}

.a4{width:794px;height:1123px;--fr:24px;--top:70px;--rib:18px;--sm:40px;--g1:10px;--h1:118px;--corn:52px;
  --g2:30px;--mw:660px;--gap:14px;--fs:26px;--ft:24px;--bot:60px}
@page{size:A4;margin:0}
@media print{html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="poster" id="p">
  <div class="frame"></div>
  <div class="ribbon">COMEÇA HOJE!</div>
  <div class="small">na Pamonharia</div>
  <h1><span class="b">Semana</span><span class="k">Black</span></h1>
  <div class="corn">🌽🌽🌽</div>
  <div class="menu">
    <div class="item"><div class="n">Pamonha tradicional<small>2 unidades</small></div><div class="dots"></div><div class="price"><span>R$</span>25,00</div></div>
    <div class="item"><div class="n">Pamonha assada<small>2 unidades</small></div><div class="dots"></div><div class="price"><span>R$</span>15,00</div></div>
    <div class="item"><div class="n">Curau<small>2 unidades</small></div><div class="dots"></div><div class="price"><span>R$</span>15,00</div></div>
    <div class="item"><div class="n">Bolinho frito<small>unidade</small></div><div class="dots"></div><div class="price"><span>R$</span>5,00</div></div>
    <div class="item"><div class="n">Bolo<small>no pedaço</small></div><div class="dots"></div><div class="price"><span>R$</span>5,00</div></div>
  </div>
  <div class="foot">Aproveite! <b>Só nesta semana</b> 🌽<span class="sub">Ofertas válidas enquanto durarem os estoques</span></div>
</div>
<script>document.getElementById('p').classList.add(new URLSearchParams(location.search).get('f')||'story')</script>
</body></html>
